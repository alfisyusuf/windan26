<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Doorprize Jalan Sehat RT 2/6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pengaturan ukuran kertas A4 */
        @page { 
            size: A4; 
            margin: 0; /* Margin ditangani oleh padding di dalam elemen halaman */
        }
        @media print {
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                background-color: transparent !important; 
            }
            .print-hide { display: none !important; }
            /* Memaksa pergantian halaman */
            .page-break { page-break-after: always; break-after: page; }
            /* Menghilangkan bayangan dan margin saat diprint */
            .a4-page { box-shadow: none !important; margin: 0 !important; }
        }
        /* Efek garis potong (sobek) */
        .cut-line { 
            border-right: 2px dashed #cbd5e1; 
        }
    </style>
</head>
<body class="bg-gray-200 font-sans flex flex-col items-center py-8 print:py-0">
    
    <!-- Tombol Print -->
    <div class="print-hide mb-6 text-center">
        <button onclick="window.print()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-colors text-lg">
            🖨️ Cetak Voucher (A4)
        </button>
        <p class="text-sm text-gray-600 mt-2">Pastikan setelan margin di jendela print adalah <b>"None"</b> atau <b>"Minimum"</b>.</p>
    </div>

    <!-- Container Utama -->
    <div id="voucher-container" class="flex flex-col gap-8 print:gap-0">
        <!-- Halaman akan di-generate oleh script -->
    </div>

    <script>
        const container = document.getElementById('voucher-container');
        
        // Data 10 Voucher Mba Yanti
        const belanjaVouchers = Array(10).fill({
            type: 'BELANJA',
            value: 'Rp 25.000',
            venue: 'Warung Mba Yanti',
            color: 'bg-red-600',
            textColor: 'text-red-700'
        });

        // Data 3 Voucher Pak Sisur
        const makanVouchers = Array(3).fill({
            type: 'MAKAN',
            value: '1 PORSI SPESIAL',
            venue: 'Warung Pak Sisur',
            color: 'bg-orange-600',
            textColor: 'text-orange-700'
        });

        const allVouchers = [...belanjaVouchers, ...makanVouchers];
        const vouchersPerPage = 8; // Membatasi 8 voucher per halaman agar ukurannya besar
        
        let htmlContent = '';

        for (let i = 0; i < allVouchers.length; i += vouchersPerPage) {
            const pageVouchers = allVouchers.slice(i, i + vouchersPerPage);
            
            // Buka tag halaman A4
            htmlContent += `
            <div class="a4-page w-[210mm] h-[297mm] bg-white p-[15mm] shadow-xl mx-auto page-break box-border relative">
                <div class="grid grid-cols-2 gap-6 h-full content-start">
            `;

            // Isi voucher di halaman tersebut
            pageVouchers.forEach((v, index) => {
                const globalIndex = i + index + 1;
                htmlContent += `
                    <div class="flex border-2 border-gray-300 rounded-xl overflow-hidden h-40 relative bg-white shadow-sm">
                        <!-- Bagian Kiri (Pita) -->
                        <div class="${v.color} w-12 flex flex-col justify-center items-center text-white cut-line relative">
                            <span class="transform -rotate-90 text-[11px] font-bold tracking-[0.25em] w-32 text-center whitespace-nowrap">
                                DIRGAHAYU RI
                            </span>
                            <!-- Aksen Lingkaran (Bolongan Kertas) -->
                            <div class="absolute -top-3 -right-3 w-6 h-6 bg-white rounded-full border border-gray-300"></div>
                            <div class="absolute -bottom-3 -right-3 w-6 h-6 bg-white rounded-full border border-gray-300"></div>
                        </div>
                        
                        <!-- Bagian Kanan (Isi Voucher) -->
                        <div class="flex-1 p-4 flex flex-col justify-between bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:12px_12px]">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-black text-2xl leading-none ${v.textColor}">VOUCHER ${v.type}</h3>
                                    <p class="text-sm text-gray-700 font-bold uppercase mt-1 tracking-wider">${v.venue}</p>
                                </div>
                                <span class="text-xs font-mono text-gray-400 font-bold bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">
                                    #${String(globalIndex).padStart(3, '0')}
                                </span>
                            </div>
                            
                            <div class="text-center my-2">
                                <span class="text-2xl font-black text-gray-800 border-y-2 border-gray-400 px-6 py-2 inline-block bg-white shadow-sm rounded-md">
                                    ${v.value}
                                </span>
                            </div>
                            
                            <div class="text-xs text-gray-600 text-center leading-relaxed bg-white/90 p-1.5 rounded font-medium border border-gray-100">
                                <span class="font-bold text-red-600">Jalan Sehat 16 Agustus</span><br>
                                Windan RT 2/6 Gumpang, Kartasura
                            </div>
                        </div>
                    </div>
                `;
            });

            // Tutup tag halaman
            htmlContent += `
                </div>
            </div>`;
        }

        container.innerHTML = htmlContent;
    </script>
</body>
</html>
