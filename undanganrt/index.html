<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pertemuan RT - Bapak-bapak</title>
    <style>
        /* Konfigurasi untuk print */
        @page {
            size: A4 landscape;
            margin: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #e5e7eb;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1 Lembar A4 Landscape */
        .kertas-a4 {
            width: 297mm;
            height: 210mm;
            background: white;
            display: flex;
            flex-direction: row;
            page-break-after: always;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 10mm auto;
        }

        @media print {
            body { background-color: white; }
            .kertas-a4 { margin: 0; box-shadow: none; }
            img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        /* Setengah A4 (A5 Portrait) */
        .undangan-a5 {
            width: 50%;
            height: 100%;
            padding: 8mm; 
            box-sizing: border-box;
            position: relative;
        }

        /* Garis potong di tengah kertas */
        .undangan-a5:first-child {
            border-right: 1px dashed #ccc;
        }

        /* Border elegan double linen */
        .border-elegan {
            border: 4px double #1f2937;
            outline: 1px solid #1f2937;
            outline-offset: -8px;
            height: 100%;
            /* PADDING DIKURANGI AGAR KONTEN PUNYA RUANG LEBIH BANYAK */
            padding: 15px; 
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Kop Surat */
        .kop-surat {
            text-align: center;
            border-bottom: 3px solid #000;
            padding-bottom: 6px; /* Disesuaikan */
            margin-bottom: 10px; /* Disesuaikan */
        }
        .kop-surat h2, .kop-surat h3 { margin: 0; line-height: 1.2; color: #000; }
        .kop-surat h2 { font-size: 17pt; font-weight: bold; }
        .kop-surat h3 { font-size: 13pt; font-weight: normal; }

        /* Isi Surat */
        .isi-surat {
            font-size: 12.5pt; /* Tetap besar, namun disesuaikan sedikit */
            line-height: 1.4; /* Jarak baris sedikit diketatkan */
            flex-grow: 1;
            color: #000; 
        }
        .tujuan { margin-bottom: 10px; }
        .nama-tujuan { font-weight: bold; font-size: 14pt;}
        
        .detail-acara table {
            margin: 5px 0 5px 15px; /* Margin tabel dikurangi */
            border-collapse: collapse;
            font-size: 12.5pt; 
        }
        .detail-acara td {
            padding: 3px 10px 3px 0;
            vertical-align: top;
        }

        /* AREA TANDA TANGAN DAN CAP */
        .ttd-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px; /* Dikurangi agar tidak nabrak bawah */
            position: relative;
        }
        
        .ttd-box {
            text-align: center;
            width: 220px; 
            position: relative;
            z-index: 2;
            font-size: 12pt; 
        }
        
        .ttd-asli {
            height: 70px;
            width: auto;
            margin-top: 2px;
            margin-bottom: -5px;
        }
        
        .ttd-nama {
            font-weight: bold;
            text-decoration: underline;
            margin-top: 0;
            font-size: 13pt;
        }
        
        .cap-asli {
            position: absolute;
            height: 130px; /* Tetap besar */
            width: auto;
            right: 120px; 
            top: -30px; /* Dinaikkan ke atas agar overlap dengan teks, bukan mendorong container ke bawah */
            z-index: 1;
            opacity: 0.85; 
            transform: rotate(-10deg); 
        }
    </style>
</head>
